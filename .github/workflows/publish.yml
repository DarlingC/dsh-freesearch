# @darlingc/dsh-freesearch — CI 自动提交到 npm 暂存队列（Staged Publishing）+ 自动建 GitHub Release
# 触发：push 到 v* tag（例如 v0.5.0）或手动 workflow_dispatch。
# 流程：1) CI 用 `npm stage publish` 把本版本提交到 npm “Staged Packages” 暂存队列
#          （此步骤不会触发账号 2FA，也不需要 OTP）。
#       之后由维护者在 npmjs.com 网页对暂存包人工 Approve / Promote（提示词用户
#       是设备认证，能通过该 2FA），Promote 后才真正对外可安装。
#       2) 用 softprops/action-gh-release 为该 tag 自动建 GitHub Release
#          （generate_release_notes: true，自动汇总 PR/提交生成 changelog）。
#          Release 创建不依赖 npm 的 stage/approve 结果，二者互不阻塞。
#
# ⚠️ 依赖：
#   1) 本 workflow 要走“CI 代发 npm 暂存”才需要 npm 发布凭证：在仓库配置 GitHub
#      Actions secret 名为 `NPM_TOKEN`（npmjs.com → Access Tokens → Generate New
#      → 类型选 Publish → 把生成的值作为 secret 存入本仓库）。
#      Staged 提交本身不会触发账号 2FA/OTP；未配 NPM_TOKEN 时该步骤会失败，但
#      已用 continue-on-error 隔离，不影响建 Release。
#   2) 该包必须先已存在于 npm registry 才能被 stage（首次发布无法用 stage）：
#      npmjs.com 上 @darlingc/dsh-freesearch 需先有一次正式发布。
#      （首次发布可由维护者在本地/网页用设备认证完成，之后才走本 workflow。）
#
# 备选：若不想在 GitHub 配 NPM_TOKEN，维护者也可在本机（已设备认证）直接运行
#       `npm stage publish`，效果等同，跳过 CI。
name: stage-publish

on:
  push:
    tags:
      - 'v*'            # 例：git tag v0.5.0 && git push origin v0.5.0 触发
  workflow_dispatch:    # 可选：手动触发

permissions:
  # npm stage publish 只需读仓库；但自动建 GitHub Release 需要写 contents。
  contents: write

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke check (avoid staging a broken tarball)
        run: |
          node --check lib/index.js
          node --check lib/client.js
          npm pack --dry-run
          # 版本一致性兜底：package.json / lib/index.js / lib/client.js 三处
          # PLUGIN_VERSION 一旦不一致（如 0.5.1→0.5.2 只改 package.json 漏改
          # PLUGIN_VERSION 的事故），这里直接退出码 1，阻止 stage 与建 Release。
          node scripts/check-version.mjs

      - name: Stage publish to npm (defer 2FA to web approve)
        # 提交到 npm 暂存队列，不触发账号 2FA；之后由维护者在 npmjs.com 网页
        # “Staged Packages” 中 Approve/Promote 才真正对外发布。
        # 需要 NPM_TOKEN secret（认证用；staged 提交不触发交互式 2FA）。
        #
        # ⚠️ continue-on-error: true —— npm 步骤的结果不得影响建 Release。
        #   维护者默认“本机发布 npm、不走 CI/CD”，未配 NPM_TOKEN 时本步骤会失败，
        #   而此时我们仍要自动建 Release。开 continue-on-error 后该失败只作为
        #   步骤告警呈现，不会让 job 失败、也不会阻断后续 Release 步骤。
        #   （不能把 secrets 直接写进 if: —— GitHub Actions 不允许；故选此解法，
        #    与文件头“二者互不阻塞”的意图一致。）
        continue-on-error: true
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        # 为该 v* tag 自动建 GitHub Release。用 softprops/action-gh-release@v2，
        # generate_release_notes: true 让 GitHub 依据 PR/提交自动汇出 changelog。
        # 选自动生成而非“用 git tag message 作 body”：现有 tag 多为轻量 tag
        # （无附注消息），用 tag message 会得到空 body；自动生成始终有内容更省心。
        # 依赖顶部 permissions 已提升为 contents: write。
        #
        # 触发条件用默认 success()（不再写 if: always()）：
        #   - 只在 checkout / install / smoke（含 check-version）都通过后才建
        #     Release —— broken tag（如 JS 语法错、npm pack 失败、版本失配）在此
        #     被拦下，不再创建误导用户的 Release。
        #   - 与 npm stage 步骤天然解耦：npm 步骤失败因上方 continue-on-error
        #     不阻断本步骤；二者互不阻塞，符合文件头注释意图。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
